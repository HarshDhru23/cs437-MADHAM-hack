name: CI

on:
  push:
  pull_request:

# PR/feature pushes supersede older checks. A main release is allowed to finish,
# so cancelling a workflow cannot leave its Azure deployment running out of order.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend and browser-test dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e
          npm run install-browsers --prefix e2e -- --with-deps

      # The single full command; exits nonzero if any suite fails, is missing or runs no tests.
      - name: Run all suites
        run: python scripts/test.py

      # The 3 Nov gate: every statement in SPEC.md tests-green, and no mapped frontend or
      # browser test failing. Private-input checks are local_tests and never count here.
      - name: Statement report (all statements)
        run: python scripts/statement_report.py --all --frontend --browser

      - name: Package the tested main revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('frontend/dist/release.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA']}), encoding='utf-8')
          PY
          python -m whitenoise.compress frontend/dist   # gzip copies of the build files; WhiteNoise serves them to browsers that accept gzip
          python scripts/package_azure.py

      - name: Keep the tested release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coursepath-${{ github.sha }}
          path: coursepath-azure.zip
          if-no-files-found: error
          retention-days: 7

      # Synthetic data only (no private inputs exist in CI).
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  postgres:
    # Production uses PostgreSQL; SQLite passing locally does not establish that (contracts.md section 8).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coursepath
          POSTGRES_PASSWORD: coursepath-ci
          POSTGRES_DB: coursepath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coursepath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COURSEPATH_DB_ENGINE: postgresql
      COURSEPATH_DB_NAME: coursepath
      COURSEPATH_DB_USER: coursepath
      COURSEPATH_DB_PASSWORD: coursepath-ci
      COURSEPATH_DB_HOST: 127.0.0.1
      COURSEPATH_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Migrations apply and are complete
        run: |
          python server/manage.py migrate --noinput
          python server/manage.py makemigrations --check --dry-run

      - name: Django tests on PostgreSQL
        run: python scripts/test.py --suite django

      # M08: back up a synthetic account and restore it into a separate, empty PostgreSQL
      # database; backup.py fails unless counts and revisions match the dump summary.
      - name: Backup and restore rehearsal on PostgreSQL
        env:
          PGPASSWORD: coursepath-ci
        run: |
          python server/manage.py shell -c "from django.contrib.auth import get_user_model; from server.records.models import AcademicRecord, AcademicPlan; u = get_user_model().objects.create_user('ci-synthetic', password='ci-synthetic-pass-8812'); AcademicRecord.objects.create(owner=u, revision=3); AcademicPlan.objects.create(owner=u, revision=2, payload={'semesters': []})"
          python scripts/backup.py dump --out "$RUNNER_TEMP/backup.json"
          createdb -h 127.0.0.1 -U coursepath coursepath_restore
          COURSEPATH_DB_NAME=coursepath_restore python scripts/backup.py restore --input "$RUNNER_TEMP/backup.json"
          rm -f "$RUNNER_TEMP/backup.json"

  deploy:
    name: Deploy production
    needs: [test, postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: coursepath-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coursepath-${{ github.sha }}

      - name: Sign in to Azure with the main-only federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the tested package
        uses: azure/webapps-deploy@v3
        with:
          app-name: coursepath-iitgn
          resource-group-name: coursepath-rg
          package: coursepath-azure.zip

      - name: Verify database health and deployed revision
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.error import URLError
          from urllib.request import Request, urlopen
          base = 'https://coursepath-iitgn.azurewebsites.net'
          def read(path):
              request = Request(base + path, headers={'Cache-Control': 'no-cache'})
              with urlopen(request, timeout=15) as response:
                  return json.load(response)
          for attempt in range(42):
              try:
                  health = read('/api/v1/health')['data']
                  release = read('/release.json')
                  if health.get('status') == health.get('database') == 'ok' and release.get('commit') == os.environ['EXPECTED_COMMIT']:
                      print('Live database is healthy and the tested revision is deployed.')
                      break
              except (URLError, OSError, ValueError, KeyError):
                  pass
              print('Waiting for the tested release to become ready:', attempt + 1)
              time.sleep(10)
          else:
              raise SystemExit('The tested revision did not become healthy at the live URL.')
          PY
