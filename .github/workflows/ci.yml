name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      # openpyxl (timetable adapter) is not in Harsh's requirements.txt yet.
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install openpyxl

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend and browser-test dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e
          npm run install-browsers --prefix e2e -- --with-deps

      # The single full command; exits nonzero if any suite fails or is missing.
      - name: Run all suites
        run: python scripts/test.py

      # Informational: statement-to-test outcomes. CP-06/07 stay RED here because
      # their private-input tests need real files that are never in CI.
      - name: Statement report
        if: always()
        continue-on-error: true
        run: python scripts/statement_report.py
